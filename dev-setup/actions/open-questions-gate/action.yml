name: Open questions gate
description: >
  Warns when an issue reaches status:done with a question still unanswered in its
  open-questions section. The rules are in check_open_questions.py next to this file.

# Temporary, old path. The action moved to skills/dev-setup/actions/open-questions-gate when this
# repo became ~/.claude (claude-config #6). Repos that still call
# dolev2/claude-config/dev-setup/actions/open-questions-gate@main land here, and this runs the
# same script from its new home: GitHub downloads the whole repo with the action, so
# the relative path exists. Remove once every repo calls the new path.
#
# Everything below `inputs:` must stay identical to the real action.yml, apart from
# the script path (test_open_questions_gate.py checks it).

inputs:
  issue:
    description: Issue number to check
    required: true
  token:
    description: Token with issues:write on the calling repo
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Check for open questions
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        ISSUE_NUMBER: ${{ inputs.issue }}
      run: python3 "${{ github.action_path }}/../../../skills/dev-setup/actions/open-questions-gate/check_open_questions.py"
