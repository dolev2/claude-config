name: Project board sync
description: >
  Two-way sync between issue labels (owner:*, status:*, area:*) and the fields of the repo's
  Project v2 board. The rules are in sync_project.py next to this file.

# Temporary, old path. The action moved to skills/dev-setup/actions/project-sync when this
# repo became ~/.claude (claude-config #6). Repos that still call
# dolev2/claude-config/dev-setup/actions/project-sync@main land here, and this runs the
# same script from its new home: GitHub downloads the whole repo with the action, so
# the relative path exists. Remove once every repo calls the new path.
#
# Everything below `inputs:` must stay identical to the real action.yml, apart from
# the script path (test_project_sync.py checks it).

inputs:
  token:
    description: PAT with project + repo (the PROJECT_TOKEN secret). GITHUB_TOKEN cannot touch Projects v2 on a user account.
    required: true
  project-number:
    description: The board's number (the PROJECT_NUMBER variable)
    required: true
  sync-marker:
    description: The hidden marker name issue bodies carry, e.g. crm-sync (the SYNC_MARKER variable)
    required: true
  project-owner:
    description: The account that owns the board
    required: false
    default: ${{ github.repository_owner }}
  issue:
    description: Sync only this issue; empty sweeps every issue
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Sync
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PROJECT_OWNER: ${{ inputs.project-owner }}
        PROJECT_NUMBER: ${{ inputs.project-number }}
        SYNC_MARKER: ${{ inputs.sync-marker }}
        ISSUE_NUMBER: ${{ inputs.issue }}
      run: python3 "${{ github.action_path }}/../../../skills/dev-setup/actions/project-sync/sync_project.py"
