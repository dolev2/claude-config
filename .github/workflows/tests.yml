name: Tests

# Runs the commands CLAUDE.md lists under "בדיקות" (lint, then the tests), on every PR and
# on every push to main.
#
# This marks a PR red, but does not lock its merge button: the repo is private on a free
# plan, without branch protection. The merge paths (dev-ship, dev-code Part B) check
# `gh pr checks` instead.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install pytest ruff==0.17.2

      - run: ruff check .
      - run: ruff format --check .

      - run: python -m pytest skills/dev-setup/scripts hooks
