name: Tests

# Runs the commands CLAUDE.md lists under "בדיקות" (lint, then the tests), on every PR and
# on every push to main.
#
# This marks a PR red, but does not lock its merge button: the repo is private on a free
# plan, without branch protection. The merge path (dev-ship) checks
# `gh pr checks` instead.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: read # the spec check reads the open issues (#226)

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install pytest ruff==0.17.2

      - run: ruff check .
      - run: ruff format --check .
      - run: python .github/file_guide_check.py

      # The local path: this repo is the action's home, so a change to it runs here first.
      - uses: ./skills/dev-setup/actions/spec-check

      - run: python -m pytest skills/dev-setup/scripts hooks
