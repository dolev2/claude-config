name: Sync labels → project board

# Writes the issue labels (status:*, area:*) onto the Project v2 fields, one way: the labels
# are the source of truth, and a card dragged on the board goes back (claude-config #111).
# The sync itself is shared: dolev2/claude-config, skills/dev-setup/actions/project-sync, where
# sync_rules.py documents the rules. It needs claude-config's Actions access set
# to "user".
#
# Only issue events run here. The 15-minute poll that puts a dragged card back in place
# runs for every repo at once from the public dolev2/.github (sync-boards.yml), where
# Actions minutes are free (claude-config #46). Do not add a schedule back.
#
# Repo settings it reads: the PROJECT_TOKEN secret and the PROJECT_NUMBER variable.

on:
  issues:
    types: [opened, reopened, labeled, unlabeled, closed]
  workflow_dispatch:

# No checkout, so no `contents: read`: the sync works through `gh` with PROJECT_TOKEN only.
permissions: {}

concurrency:
  group: sync-project
  cancel-in-progress: false

jobs:
  sync:
    # Off until PROJECT_NUMBER is set, which is done only after the PROJECT_TOKEN secret:
    # without the guard every run fails and mails (OSEA, 2026-10-24).
    if: vars.PROJECT_NUMBER != ''
    runs-on: ubuntu-latest
    steps:
      # @main on purpose: a fix to the sync reaches every repo without touching it.
      - uses: dolev2/claude-config/skills/dev-setup/actions/project-sync@main
        with:
          token: ${{ secrets.PROJECT_TOKEN }}
          project-number: ${{ vars.PROJECT_NUMBER }}
          # On an issue event, sync only that issue; a manual run sweeps everything.
          issue: ${{ github.event.issue.number }}
