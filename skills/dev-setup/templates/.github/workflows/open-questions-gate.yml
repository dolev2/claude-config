name: Open questions gate

# Warns when an issue reaches `status:in-review` (or `status:done`) with a question still
# unanswered. In-review is the last stop before the merge (claude-config #108).
# The gate itself is shared: dolev2/claude-config, skills/dev-setup/actions/open-questions-gate.
# It needs claude-config's Actions access set to "user" (Settings → Actions → Access),
# otherwise this run fails on "Unable to resolve action".
#
# Why `edited` is here too: the fix for a warning is ticking a checkbox in the body, and
# that must clear the label without a second label event.
#
# Timing note: dragging a card on a user-owned project raises no webhook at all
# (see sync-project.yml). The label arrives on the next 15-minute sync poll, and only then
# does this run. Labelling the issue directly is what makes it immediate.

on:
  issues:
    types: [labeled, edited, reopened]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to check
        required: true

permissions:
  # No checkout, so no `contents: read`: the gate reads and writes issues through `gh` only.
  issues: write

concurrency:
  group: open-questions-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # @main on purpose: a fix to the gate reaches every repo without touching it.
      - uses: dolev2/claude-config/skills/dev-setup/actions/open-questions-gate@main
        with:
          issue: ${{ github.event.issue.number || inputs.issue }}
          # The default token is enough: this job only reads and writes issues, never
          # Projects v2, which is the reason sync-project.yml needs a PAT.
          token: ${{ secrets.GITHUB_TOKEN }}
