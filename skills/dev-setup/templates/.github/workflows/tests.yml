name: Tests

# From the dev-setup template (dolev2/claude-config). Runs lint and the commands CLAUDE.md
# lists under its tests section, on every PR and on every push to the default branch.
#
# Fill in before committing: the default branch, the folders, and each `# <...>` line.
# Delete the job of a side the repo does not have. The `files` job stays in every repo,
# a static site too: it checks that the file guide in README.md is complete (#89), and
# the spec files in docs/specs/ (claude-config #226).
#
# Lint runs before the tests in the same job: it is fast and fails first, and the job's
# install step already serves both.
#
# This marks a PR red, but does not lock its merge button: a private repo on a free plan has
# no branch protection. The merge path (dev-ship) checks `gh pr checks`.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: read # the spec check reads the open issues (claude-config #226)

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the size check diffs the PR against its base

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: python .github/file_guide_check.py

      # The specs in docs/specs/: an error in a file fails, a gap against the issues
      # only warns. A repo with no spec yet only warns (claude-config #226).
      - uses: dolev2/claude-config/skills/dev-setup/actions/spec-check@main

      # A code or skill file the PR moved past about 300 lines gets a warning with the
      # split questions, and never fails (claude-config #369).
      - if: github.event_name == 'pull_request'
        uses: dolev2/claude-config/skills/dev-setup/actions/size-check@main

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # ruff is pinned in the requirements, next to the test packages.
      - run: pip install -r backend/requirements.txt

      - run: ruff check .
      - run: ruff format --check .

      # <the backend test command from CLAUDE.md, e.g. python -m pytest backend/tests>

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --prefix frontend

      - run: npm --prefix frontend run lint

      # <the frontend test command from CLAUDE.md, e.g. npm --prefix frontend test>
