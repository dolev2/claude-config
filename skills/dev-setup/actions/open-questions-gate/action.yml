name: Open questions gate
description: >
  Warns when an issue reaches status:in-review (or status:done) with a question still
  unanswered in its open-questions section. The rules are in check_open_questions.py next to this file.

# One copy for every repo with the pipeline: each repo's open-questions-gate.yml calls
# dolev2/claude-config/skills/dev-setup/actions/open-questions-gate@main, so a fix merged here
# reaches all of them at once (claude-config #2; the copies had drifted, CRM #55).
#
# Composite, not a reusable workflow: a reusable workflow must live in this repo's
# .github/workflows/ and would also run here as a workflow. The script talks only to
# `gh`, so the calling repo needs no checkout; ubuntu-latest ships python3 and gh.

inputs:
  issue:
    description: Issue number to check
    required: true
  token:
    description: Token with issues:write on the calling repo
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Check for open questions
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        ISSUE_NUMBER: ${{ inputs.issue }}
      run: python3 "${{ github.action_path }}/check_open_questions.py"
